name: AirEye
description: >-
  AirEye is a wireless airspace security company delivering Wireless Detection
  and Response (WDR) for enterprise IT and OT environments. Its AI-driven,
  agentless SaaS platform individually protects every Wi-Fi-enabled asset without
  isolating it from the network, identifying and classifying devices and wireless
  interactions, visualizing wireless communications in real time, automatically
  preventing threats through policy enforcement, and providing forensic analysis
  of incidents. AirEye addresses unauthorized wireless access, data leakage,
  network-segmentation circumvention, and device hijacking, with a focus on
  healthcare providers, defense manufacturers, and general enterprises. The
  company has been recognized in multiple Gartner market guides for medical
  device security and operational technology protection. This profile was
  surfaced as a portfolio-company lead; AirEye publishes no public API or
  developer program at this time.
